<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>評価シート</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

  :root{
    --paper:#f5f4f0;
    --surface:#ffffff;
    --ink:#23262b;
    --muted:#6d756f;
    --line:#d8dbd6;
    --accent:#0e7c86;
    --accent-ink:#ffffff;
    --panel:#23282c;
    --panel-ink:#f3f2ee;
    --result:#f6d9a0;
    --result-ink:#5a4416;
    --self:#f0c9c2;
    --self-ink:#5a2c24;
    --eval:#bcdce6;
    --eval-ink:#153a44;
    --note:#a8433e;
    --input-bg:#ffffff;
    --shadow:rgba(30,32,28,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15181a;
      --surface:#1c2023;
      --ink:#e9e7e2;
      --muted:#9aa39d;
      --line:#343a3d;
      --accent:#2bb6c2;
      --accent-ink:#07181b;
      --panel:#0e1113;
      --panel-ink:#ececeb;
      --result:#4d3d1d;
      --result-ink:#f3d999;
      --self:#4a2b28;
      --self-ink:#f0c3bc;
      --eval:#1e3a44;
      --eval-ink:#bfe3ec;
      --note:#e08882;
      --input-bg:#22272a;
      --shadow:rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#15181a;
    --surface:#1c2023;
    --ink:#e9e7e2;
    --muted:#9aa39d;
    --line:#343a3d;
    --accent:#2bb6c2;
    --accent-ink:#07181b;
    --panel:#0e1113;
    --panel-ink:#ececeb;
    --result:#4d3d1d;
    --result-ink:#f3d999;
    --self:#4a2b28;
    --self-ink:#f0c3bc;
    --eval:#1e3a44;
    --eval-ink:#bfe3ec;
    --note:#e08882;
    --input-bg:#22272a;
    --shadow:rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 20px;
    background:var(--panel);
    color:var(--panel-ink);
    font-size:13px;
  }
  .topbar .brand{ font-weight:900; letter-spacing:.02em; }
  .topbar .right{ display:flex; align-items:center; gap:14px; }
  .topbar a, .topbar button.link{
    color:var(--panel-ink); opacity:.85; text-decoration:none;
    background:none; border:none; font-family:inherit; font-size:13px; cursor:pointer; padding:0;
  }
  .topbar a:hover, .topbar button.link:hover{ opacity:1; text-decoration:underline; }
  .center-loading{
    min-height:60vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:13px;
  }
  .center-loading[hidden]{ display:none; }

  /* ---------- tabs ---------- */
  .tab-bar{
    display:flex;
    gap:4px;
    padding:8px 20px 0;
    background:var(--panel);
    overflow-x:auto;
  }
  .tab-btn-wrap{
    display:inline-flex;
    align-items:center;
    background:var(--surface);
    border-radius:8px 8px 0 0;
    overflow:hidden;
    flex:none;
  }
  .tab-btn{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:9px 14px;
    border:none;
    background:transparent;
    color:var(--panel-ink);
    opacity:.7;
    cursor:pointer;
    border-radius:8px 8px 0 0;
    white-space:nowrap;
  }
  /* tabs wrapped in .tab-btn-wrap sit on a light --surface background, not the dark tab-bar */
  .tab-btn-wrap .tab-btn{ color:var(--ink); opacity:.55; }
  .tab-btn.active{ background:var(--paper); color:var(--accent); opacity:1; }
  .tab-btn-wrap.active .tab-btn{ background:var(--paper); color:var(--accent); opacity:1; }
  .tab-close{
    font-family:inherit;
    font-size:13px;
    padding:0 10px 0 2px;
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .tab-btn-wrap.active .tab-close{ background:var(--paper); }
  .tab-close:hover{ color:var(--note); }
  .tab-panel[hidden]{ display:none; }

  .period-switch{
    display:flex;
    gap:6px;
  }
  .period-btn{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:8px 18px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--surface);
    color:var(--muted);
    cursor:pointer;
  }
  .period-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--muted);
    text-transform:uppercase;
    font-weight:500;
  }

  .page{
    max-width:1480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:20px;
    padding:24px 24px 64px;
  }

  /* ---------- summary panel ---------- */
  .summary-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .summary-toolbar h1{ font-size:22px; font-weight:900; margin:0; }
  .summary-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .search-input{
    font-family:inherit;
    font-size:13px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    color:var(--ink);
    max-width:280px;
    width:100%;
  }
  .summary-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .people-list{
    background:var(--surface);
    border:2px solid var(--ink);
    border-radius:10px;
    overflow-x:auto;
  }
  table.summary-table{
    border-collapse:collapse;
    width:100%;
    font-size:12.5px;
  }
  .summary-table th, .summary-table td{
    border:1px solid var(--ink);
    padding:8px 10px;
    text-align:center;
  }
  .summary-table thead th{
    background:var(--panel);
    color:var(--panel-ink);
    font-weight:700;
    font-size:11.5px;
  }
  .summary-table th.col-name, .summary-table td.col-name{
    text-align:left;
    min-width:140px;
  }
  .summary-table td.col-name{ font-weight:700; }
  .summary-table tr.person-row{ cursor:pointer; }
  .summary-table tr.person-row:hover td{ background:color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .summary-table td.person-updated{ font-size:11px; font-weight:500; color:var(--muted); white-space:nowrap; }
  .grade-pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:26px;
    padding:2px 8px;
    border-radius:999px;
    background:var(--result);
    color:var(--result-ink);
    font-weight:900;
    font-size:13px;
  }

  .review-table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  .review-table th, .review-table td{ border:1px solid var(--line); padding:8px 10px; text-align:left; }
  .review-table th{ background:var(--panel); color:var(--panel-ink); }
  .review-table input{ width:100%; }

  /* ---------- per-person toolbar ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .btn-file{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:700;
    font-size:13px;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 4px 10px var(--shadow);
    border:none;
  }
  .btn-file:hover{ filter:brightness(1.06); }
  .btn-file input[type="file"]{ display:none; }
  .btn-reset{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 16px;
    font-size:13px;
    font-weight:500;
    font-family:inherit;
    cursor:pointer;
  }
  .btn-reset:hover{ color:var(--ink); border-color:var(--ink); }
  .import-status{
    font-size:12.5px;
    color:var(--muted);
  }
  .import-status.error{ color:var(--note); font-weight:700; }
  .import-status.ok{ color:var(--accent); font-weight:700; }

  /* ---------- header panel ---------- */
  .header{
    display:grid;
    grid-template-columns:1.1fr 1.4fr;
    gap:16px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 6px 20px var(--shadow);
    overflow:hidden;
  }
  .header-title{
    background:var(--accent);
    color:var(--accent-ink);
    padding:26px 28px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;
  }
  .header-title h1{
    margin:0;
    font-size:26px;
    font-weight:900;
    letter-spacing:.02em;
  }
  .header-title .period-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:14px;
    font-weight:500;
    opacity:.95;
  }
  .header-title .period-row input{
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.3);
    color:var(--accent-ink);
    border-radius:6px;
    padding:4px 8px;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    font-variant-numeric:tabular-nums;
    min-width:220px;
  }
  .header-title .period-row input::placeholder{ color:rgba(255,255,255,.7); }
  .header-title .hint{
    font-size:12px;
    font-weight:500;
    opacity:.8;
    margin-top:4px;
  }

  .header-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:var(--line);
  }
  .info-cell{
    background:var(--surface);
    padding:12px 16px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .info-cell.dark{
    background:var(--panel);
    color:var(--panel-ink);
  }
  .info-label{
    font-size:11px;
    letter-spacing:.06em;
    color:var(--muted);
    font-weight:500;
  }
  .info-cell.dark .info-label{ color:var(--panel-ink); opacity:.7; }
  .info-cell input{
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    padding:2px 0;
    border-bottom:1px solid var(--line);
    width:100%;
  }
  .info-cell.dark input{
    color:var(--panel-ink);
    border-bottom:1px solid rgba(255,255,255,.25);
  }
  .info-cell input:focus{ outline:none; border-color:var(--accent); }
  .result-cell{
    grid-column:1 / -1;
    background:var(--panel);
    color:var(--panel-ink);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
  }
  .result-cell .score-wrap{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .result-cell .score{
    font-size:22px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    color:var(--result);
  }
  .grade-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:30px;
    padding:2px 10px;
    border-radius:999px;
    background:var(--result);
    color:var(--result-ink);
    font-weight:900;
    font-size:14px;
  }

  /* ---------- table ---------- */
  .table-wrap{
    background:var(--surface);
    border:2px solid var(--ink);
    border-radius:10px;
    box-shadow:0 6px 20px var(--shadow);
    overflow-x:auto;
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width:1280px;
    font-size:11.5px;
  }
  th,td{
    border:1px solid var(--ink);
    padding:5px 7px;
    vertical-align:middle;
    text-align:center;
  }
  thead th{
    background:var(--panel);
    color:var(--panel-ink);
    font-weight:700;
    font-size:11px;
    letter-spacing:.02em;
    padding:7px;
  }
  th.col-item{ min-width:130px; }
  td.col-item{
    text-align:left;
    font-weight:700;
    font-size:12px;
    background:var(--surface);
    white-space:pre-line;
    min-width:130px;
  }
  td.col-weight{
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:13px;
    color:var(--accent);
    min-width:48px;
  }
  td.col-weight.no-weight{ color:var(--muted); font-size:11px; font-weight:500; }
  td.col-criteria{
    text-align:left;
    line-height:1.45;
    min-width:220px;
    max-width:300px;
    font-size:11px;
    white-space:pre-line;
  }
  th.scale-group{ background:var(--panel); }
  th.scale-num{
    background:var(--panel);
    min-width:88px;
  }
  td.scale{
    font-size:10.5px;
    line-height:1.35;
    color:var(--muted);
    min-width:88px;
    white-space:pre-line;
  }
  td.scale.tier-hit{
    background:var(--result);
    color:var(--result-ink);
    font-weight:700;
  }
  td.col-result{
    background:var(--result);
    min-width:190px;
    max-width:280px;
  }
  td.col-result textarea{
    width:100%;
    min-height:52px;
    resize:none;
    overflow-y:hidden;
    text-align:left;
    font-family:inherit;
    font-size:10.5px;
    line-height:1.4;
    color:var(--result-ink);
    font-weight:600;
    background:transparent;
    border:1px solid rgba(0,0,0,.18);
    border-radius:5px;
    padding:5px 7px;
  }
  th.grp-self{ background:var(--self); color:var(--self-ink); }
  td.col-self{ background:color-mix(in srgb, var(--self) 30%, var(--surface)); min-width:160px; }
  td.col-self select{ font-size:14px; padding:7px 6px; }
  td.col-score{
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:13px;
    min-width:90px;
  }
  .mbo-tab{
    writing-mode:vertical-rl;
    background:var(--panel);
    color:var(--panel-ink);
    font-weight:700;
    letter-spacing:.15em;
    font-size:11px;
    padding:14px 8px;
  }

  select, input[type="number"], input[type="text"]{
    font-family:inherit;
    border:1px solid var(--line);
    background:var(--input-bg);
    color:var(--ink);
    border-radius:5px;
    padding:4px 3px;
    font-size:11.5px;
    width:100%;
  }
  select:focus, input:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .comment-block{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
  }
  .comment-block textarea{
    grid-column:span 1;
    font-family:inherit;
    font-size:11px;
    border:1px solid var(--line);
    background:var(--input-bg);
    color:var(--ink);
    border-radius:5px;
    padding:5px 7px;
    resize:none;
    overflow-y:hidden;
    min-height:44px;
    width:100%;
  }
  .comment-block textarea.wide{ grid-column:1 / -1; }
  .comment-label{
    font-size:10.5px;
    color:var(--muted);
    font-weight:500;
    display:block;
    margin-bottom:2px;
  }

  tr.total td{
    background:var(--panel);
    color:var(--panel-ink);
    font-weight:900;
    font-size:13px;
    padding:9px 7px;
  }
  tr.total .total-score{
    font-size:17px;
    color:var(--result);
    font-variant-numeric:tabular-nums;
  }

  .footnote{
    font-size:11.5px;
    color:var(--muted);
    line-height:1.6;
    padding:2px 4px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">評価シート</span>
    <div class="right">
      <span id="user-email"></span>
      <a href="admin.html" id="admin-link" hidden>ユーザー承認</a>
      <button class="link" id="logout-btn">ログアウト</button>
    </div>
  </div>

  <div class="center-loading" id="loading">読み込み中...</div>

  <div id="app-shell" hidden>
    <div class="tab-bar" id="tab-bar"></div>
    <div id="tab-panels">
      <div class="tab-panel" data-tab-id="summary">
        <div class="page">
          <div class="summary-toolbar">
            <h1>評価シート サマリー</h1>
            <div class="summary-actions">
              <label class="btn-file">
                📥 Excelを一括インポート
                <input type="file" id="bulk-file-input" accept=".xlsx,.xls" multiple>
              </label>
              <button class="btn-reset" id="add-new-btn" type="button">＋ 新規追加</button>
            </div>
          </div>
          <div class="summary-controls">
            <div class="period-switch" id="summary-period-switch">
              <button class="period-btn active" type="button" data-period="first_half">上期</button>
              <button class="period-btn" type="button" data-period="second_half">下期</button>
            </div>
            <input type="text" id="search-input" class="search-input" placeholder="氏名で検索">
          </div>
          <div id="bulk-review" hidden></div>
          <div id="people-list" class="people-list"></div>
          <p id="summary-status" class="footnote"></p>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const escapeHtml = (s) => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  const SAMPLE_MODEL = {
    meta:{
      dept:'', grade:'', name:'',
      org:'セールスオペレーション部',
      firstEvaluator:'樋口社長', finalEvaluator:'樋口社長',
      period:'2026年9月〜2027年2月'
    },
    items:[
      { name:'全体売上\n└通常案件、セラーの合算', weight:20, maxPoint:6,
        criteria:'通常案件、セラーの売上を¥━━━━━━', note:'変更なし',
        tiers:['75%未満','75%以上88%未満','88%以上100%未満','100%以上111%未満','111%以上120%未満','120%以上'],
        self:null, first:null, final:null },
      { name:'担当案件売り上げ', weight:40, maxPoint:6,
        criteria:'ヨミ表の目標金額に対する達成率\n目標金額：※各自記載', note:'変更なし',
        tiers:['75%未満','75%以上88%未満','88%以上100%未満','100%以上111%未満','111%以上120%未満','120%以上'],
        self:null, first:null, final:null },
      { name:'粗利率\n（売上と人件費で計算）', weight:20, maxPoint:6,
        criteria:'SO部の粗利率を平均30%以上とする\n※全体の粗利率は難易度高いかも？自評価？積み上げ成果？（青木）', note:'変更なし',
        tiers:['25.5%未満','25.5%以上','28%以上','目標達成','32%以上','35%以上'],
        self:null, first:null, final:null },
      { name:'KPI達成', weight:null, maxPoint:6,
        criteria:'→KPIに対しての達成率（担当案件における）\n※KPIへの動きはある？（青木）', note:'',
        tiers:['90%未満','90%以上〜95%未満','95%以上〜100%未満','100%以上〜110%未満','110%以上〜120%未満','120%以上'],
        self:null, first:null, final:null },
      { name:'休眠顧客からの売り上げ創出', weight:20, maxPoint:6,
        criteria:'接点を持った、商談化した、受注した、金額', note:'後藤さん（尺度）',
        tiers:['CS活動ができ…','商談化案件あり','確度（％）×見込 50万','確度（％）×見込 100万','確度（％）×見込 150万','確度（％）×見込 200万'],
        self:null, first:null, final:null },
    ],
    contribution:{
      weight:10,
      criteria:'MBO評価以外の貢献度について最大10ptで評価',
      comments:{ self:'', first:'', final:'' },
      self:null, first:null, final:null
    }
  };

  function gradeFor(total){
    if(total >= 80) return 'S';
    if(total >= 70) return 'A';
    if(total >= 60) return 'B';
    if(total >= 50) return 'C';
    if(total >= 40) return 'D';
    return 'E';
  }

  function tierOptions(selected, tierCount){
    let out = `<option value="">未入力</option>`;
    for(let i=1;i<=tierCount;i++){
      out += `<option value="${i}"${Number(selected)===i ? ' selected' : ''}>${i}</option>`;
    }
    return out;
  }

  function itemRowHtml(it, idx, totalItems){

      : '';
    const scaleCells = it.tiers.map(desc => `<td class="scale">${escapeHtml(desc)}</td>`).join('');
    return `
      <tr class="item-row" data-weight="${hasWeight ? it.weight : 0}" data-has-weight="${hasWeight ? 1 : 0}" data-max="${it.maxPoint || tierCount}">
        ${mboCell}
        <td class="col-item">${escapeHtml(it.name)}</td>
        <td class="col-weight${hasWeight ? '' : ' no-weight'}">${hasWeight ? it.weight : '参考'}</td>
        <td class="col-criteria">${escapeHtml(it.criteria)}</td>
        <td class="col-result"><textarea>${escapeHtml(it.note)}</textarea></td>
        ${scaleCells}
        <td class="col-self"><select class="tier-select self">${tierOptions(it.self, tierCount)}</select></td>
        <td class="col-score">—</td>

  function contribRowHtml(c, tierCount){
    return `
      <tr class="contrib-row" data-weight="${c.weight}">
        <td class="col-item">貢献ポイント</td>
        <td class="col-weight">${c.weight}</td>

          <div class="comment-block">

        <td class="col-score">—</td>
      </tr>`;

  function updateTierHighlight(row, val){
    const cells = row.querySelectorAll('td.scale');
    cells.forEach((cell, i) => cell.classList.toggle('tier-hit', val !== '' && (i + 1) === Number(val)));
  }

  function setMeta(root, model){
    root.querySelector('.f-dept').value = model.meta.dept || '';
    root.querySelector('.f-grade').value = model.meta.grade || '';
    root.querySelector('.f-name').value = model.meta.name || '';
    root.querySelector('.f-org').value = model.meta.org || '';
    root.querySelector('.f-first-evaluator').value = model.meta.firstEvaluator || '';
    root.querySelector('.f-final-evaluator').value = model.meta.finalEvaluator || '';
    root.querySelector('.f-period').value = model.meta.period || '';
  }

  function renderModel(root, model){
    setMeta(root, model);

    const tierCount = (model.items[0] && model.items[0].tiers.length) || 6;
    root.querySelector('.scale-group-header').setAttribute('colspan', tierCount);
    root.querySelector('.total-colspan-cell').setAttribute('colspan', 3 + tierCount);
    const numsRow = root.querySelector('.scale-nums-row');
    numsRow.innerHTML = '<th colspan="5"></th>' +
      Array.from({length: tierCount}, (_, i) => `<th class="scale-num">${i + 1}</th>`).join('') +
      '<th colspan="2"></th>';

    let html = '';
    let sw = 0;
    model.items.forEach((it, idx) => {
      if(it.weight !== null && it.weight !== undefined) sw += it.weight;
      html += itemRowHtml(it, idx, model.items.length);
    });
    if(model.contribution) html += contribRowHtml(model.contribution, tierCount);
    root.querySelector('.rows-tbody').innerHTML = html;

    const totalWeight = sw + (model.contribution ? model.contribution.weight : 0);
    root.querySelector('.total-weight-cell').textContent = totalWeight;

    attachRowHandlers(root);
    recalcAll(root);
  }

  function recalcAll(root){
    let mboSum = 0;
    root.querySelectorAll('.rows-tbody tr.item-row').forEach(row => {
      const hasWeight = row.dataset.hasWeight === '1';
      const weight = Number(row.dataset.weight);
      const max = Number(row.dataset.max) || 6;
      const scoreCell = row.querySelector('.col-score');
      const selfSel = row.querySelector('select.tier-select.self');
      updateTierHighlight(row, selfSel.value);
      if(!hasWeight){ scoreCell.textContent = '参考'; return; }
      if(selfSel.value === ''){ scoreCell.textContent = '—'; return; }
      // 点数÷満点×100×ウエイト÷100
      const val = (Number(selfSel.value) / max) * 100 * weight / 100;
      scoreCell.textContent = val.toFixed(1);
      mboSum += val;
    });

    // 貢献ポイントは上の計算式を通さず、入力値をそのまま反映する
    let contribScore = 0;
    const contribRow = root.querySelector('.rows-tbody tr.contrib-row');
    if(contribRow){
      const selfInput = contribRow.querySelector('input.point-input.self');
      const scoreCell = contribRow.querySelector('.col-score');
      if(selfInput.value === ''){ scoreCell.textContent = '—'; }
      else {
        contribScore = Number(selfInput.value);
        scoreCell.textContent = contribScore.toFixed(1);
      }
    }

    const total = mboSum + contribScore;
    root.querySelectorAll('.total-score').forEach(el => el.textContent = total.toFixed(1));
    const gradeEl = root.querySelector('.total-grade');
    if(gradeEl) gradeEl.textContent = gradeFor(total);
  }

  function attachRowHandlers(root){
    root.querySelectorAll('.rows-tbody select, .rows-tbody input').forEach(el => {
      el.addEventListener('change', () => recalcAll(root));
      el.addEventListener('input', () => recalcAll(root));
    });
    root.querySelectorAll('.rows-tbody textarea').forEach(el => {
      autoGrow(el);
      el.addEventListener('input', () => autoGrow(el));
    });
  }

  function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }

  function selVal(el){
    return (!el || el.value === '') ? null : Number(el.value);
  }

  function collectModelFromDOM(root){
    const meta = {
      dept: root.querySelector('.f-dept').value,
      grade: root.querySelector('.f-grade').value,
      name: root.querySelector('.f-name').value,
      org: root.querySelector('.f-org').value,
      firstEvaluator: root.querySelector('.f-first-evaluator').value,
      finalEvaluator: root.querySelector('.f-final-evaluator').value,
      period: root.querySelector('.f-period').value,
    };

    const items = [];
    root.querySelectorAll('.rows-tbody tr.item-row').forEach(row => {
      const tiers = Array.from(row.querySelectorAll('td.scale')).map(td => td.textContent);
      items.push({
        name: row.querySelector('td.col-item').textContent,
        weight: row.dataset.hasWeight === '1' ? Number(row.dataset.weight) : null,
        maxPoint: Number(row.dataset.max) || tiers.length,
        criteria: row.querySelector('td.col-criteria').textContent,
        note: row.querySelector('td.col-result textarea').value,
        tiers,
        self: selVal(row.querySelector('select.tier-select.self')),
        first: null,
        final: null,
      });
    });

    let contribution = null;
    const contribRow = root.querySelector('.rows-tbody tr.contrib-row');
    if(contribRow){
      contribution = {
        weight: Number(contribRow.dataset.weight),
        criteria: contribRow.querySelector('td.col-criteria').dataset.criteria || '',
        comments:{
          self: contribRow.querySelector('.comment-self').value,
          first: contribRow.querySelector('.comment-first').value,
          final: contribRow.querySelector('.comment-final').value,
        },
        self: selVal(contribRow.querySelector('input.point-input.self')),
        first: null,
        final: null,
      };
    }

    return { meta, items, contribution };
  }

  /* ---------- xlsx parsing (unchanged logic) ---------- */
  function cellAt(ws, r, c){
    const addr = XLSX.utils.encode_cell({ r, c });
    const cell = ws[addr];
    if(!cell || cell.t === 'e') return null;
    if(typeof cell.v === 'string' && (cell.v.startsWith('=') || cell.v.startsWith('#'))) return null;
    return cell.v;
  }
  function mergeEndCol(merges, r, c){
    for(const m of merges){ if(m.s.r === r && m.s.c === c) return m.e.c; }
    return c;
  }
  function valueAfterLabel(ws, merges, r, labelCol){
    const labelEnd = mergeEndCol(merges, r, labelCol);
    return cellAt(ws, r, labelEnd + 1);
  }
  function textAt(ws, r, c){
    const v = cellAt(ws, r, c);
    return (v === null || v === undefined) ? '' : String(v).trim();
  }
  function normTier(v){
    if(v === null || v === undefined || v === '' || v === '未入力') return null;
    const n = Number(v);
    return isNaN(n) ? null : n;
  }

  function parseSheetModel(ws){
    if(!ws['!ref']) throw new Error('シートにデータが見つかりません');
    const ref = XLSX.utils.decode_range(ws['!ref']);
    const merges = ws['!merges'] || [];

    let headerRow = -1;
    let col = {};
    for(let r = ref.s.r; r <= ref.e.r; r++){
      for(let c = ref.s.c; c <= ref.e.c; c++){
        if(textAt(ws, r, c) === '項目'){ headerRow = r; col.item = c; }
      }
      if(headerRow >= 0) break;
    }
    if(headerRow < 0) throw new Error('「項目」列のヘッダーが見つかりませんでした。テンプレート形式を確認してください。');

    for(let c = ref.s.c; c <= ref.e.c; c++){
      const v = textAt(ws, headerRow, c);
      if(v === 'ウエイト') col.weight = c;
      if(v === '評価基準') col.criteria = c;
      if(v === '結果') col.result = c;
      if(v === '評価尺度') col.scaleLabel = c;
      if(v === '被評価者') col.self = c;
      if(v === '一次評価者') col.first = c;
      if(v === '最終評価者') col.final = c;
      if(v === '満点') col.maxPoint = c;
      if(v === 'スコア') col.score = c;
    }
    ['weight','criteria','result','scaleLabel','self','first','final','score'].forEach(k => {
      if(col[k] === undefined) throw new Error(`「${k}」に対応する列が見つかりませんでした。`);
    });

    let scaleStart = col.scaleLabel, scaleEnd = col.scaleLabel;
    merges.forEach(m => {
      if(m.s.r === headerRow && m.s.c <= col.scaleLabel && m.e.c >= col.scaleLabel){
        scaleStart = m.s.c; scaleEnd = m.e.c;
      }
    });

    const groupCol = Math.max(ref.s.c, col.item - 2);

    const meta = { dept:'', grade:'', name:'', org:'', firstEvaluator:'', finalEvaluator:'', period:'' };
    function asStr(v){ return (v === null || v === undefined) ? '' : String(v); }
    for(let r = ref.s.r; r < headerRow; r++){
      for(let c = ref.s.c; c <= ref.e.c; c++){
        const v = textAt(ws, r, c);
        if(v === '所属') meta.dept = asStr(valueAfterLabel(ws, merges, r, c));
        if(v === '役職/グレード' || v === '役職／グレード') meta.grade = asStr(valueAfterLabel(ws, merges, r, c));
        if(v === '氏名') meta.name = asStr(valueAfterLabel(ws, merges, r, c));
        if(v === '一次評価者') meta.firstEvaluator = asStr(valueAfterLabel(ws, merges, r, c));
        if(v === '最終評価者') meta.finalEvaluator = asStr(valueAfterLabel(ws, merges, r, c));
        if(v === '【評価期間】' || v === '評価期間') meta.period = asStr(valueAfterLabel(ws, merges, r, c));
      }
    }
    meta.org = 'セールスオペレーション部';

    const items = [];
    let contribution = null;
    let r = headerRow + 1;
    while(r <= ref.e.r){
      const groupVal = textAt(ws, r, groupCol);
      if(groupVal.indexOf('貢献') >= 0){
        contribution = {
          weight: Number(cellAt(ws, r, col.weight)) || 0,
          criteria: textAt(ws, r, col.criteria),
          comments:{
            self: textAt(ws, r + 1, col.result),
            first: textAt(ws, r + 1, scaleStart),
            final: textAt(ws, r + 3, scaleStart)
          },
          self: normTier(cellAt(ws, r, col.self)),
          first: normTier(cellAt(ws, r, col.first)),
          final: normTier(cellAt(ws, r, col.final))
        };
        break;
      }
      if(groupVal === 'TOTAL') break;

      const name = textAt(ws, r, col.item);
      const weightVal = cellAt(ws, r, col.weight);
      const tierNum1 = cellAt(ws, r, scaleStart);
      if((name || (weightVal !== null && weightVal !== undefined && weightVal !== '')) &&
         (Number(tierNum1) === 1)){
        const tiers = [];
        for(let c = scaleStart; c <= scaleEnd; c++){
          tiers.push(textAt(ws, r + 1, c));
        }
        const maxPointVal = col.maxPoint !== undefined ? Number(cellAt(ws, r, col.maxPoint)) : null;
        items.push({
          name: name || '(項目名未設定)',
          weight: (weightVal === null || weightVal === undefined || weightVal === '') ? null : Number(weightVal),
          maxPoint: maxPointVal || tiers.length,
          criteria: textAt(ws, r, col.criteria),
          note: textAt(ws, r, col.result),
          tiers,
          self: normTier(cellAt(ws, r, col.self)),
          first: normTier(cellAt(ws, r, col.first)),
          final: normTier(cellAt(ws, r, col.final))
        });
        r += 2;
        continue;
      }
      r++;
    }

    if(items.length === 0) throw new Error('評価項目の行を認識できませんでした。');

    return { meta, items, contribution };
  }

  // A workbook has 4 sheets total; only "上期評価シート" and "下期評価シート" are import targets.
  function parseWorkbookAll(workbook){
    const result = { first_half: null, second_half: null };
    workbook.SheetNames.forEach(sheetName => {
      if(sheetName.indexOf('上期') >= 0){
        try{ result.first_half = parseSheetModel(workbook.Sheets[sheetName]); }catch(e){ /* leave null */ }
      } else if(sheetName.indexOf('下期') >= 0){
        try{ result.second_half = parseSheetModel(workbook.Sheets[sheetName]); }catch(e){ /* leave null */ }
      }
    });
    return result;
  }

  // Tolerates a legacy flat-model row shape (pre-period-split) by treating it as empty.
  function normalizePeriods(data){
    if(data && (data.first_half !== undefined || data.second_half !== undefined)){
      return { first_half: data.first_half || null, second_half: data.second_half || null };
    }
    return { first_half: null, second_half: null };
  }

  function setActive(tabId){
    state.active = tabId;
    document.querySelectorAll('.tab-panel').forEach(p => { p.hidden = (p.dataset.tabId !== tabId); });
    renderTabBar();
  }

  function closeTab(tabId){
    state.tabs = state.tabs.filter(t => t.id !== tabId);
    delete state.models[tabId];
    const panel = document.querySelector(`.tab-panel[data-tab-id="${tabId}"]`);
    if(panel) panel.remove();
    if(state.active === tabId){ setActive('summary'); }
    else { renderTabBar(); }
  }

  document.getElementById('tab-bar').addEventListener('click', (e) => {
    const closeBtn = e.target.closest('.tab-close');
    if(closeBtn){ closeTab(closeBtn.dataset.tabId); return; }
    const tabBtn = e.target.closest('.tab-btn');
    if(tabBtn){ setActive(tabBtn.dataset.tabId); }
  });

  function updateSheetTitle(panel, period){
    const el = panel.querySelector('.sheet-title');
    if(el) el.textContent = period === 'first_half' ? '評価シート（上期）' : '評価シート（下期）';
  }

  function updatePeriodSwitchUI(panel, period){
    panel.querySelectorAll('.period-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.period === period);
    });
  }

  function switchPeriod(tabId, newPeriod){
    const entry = state.models[tabId];
    if(entry.activePeriod === newPeriod) return;
    const panel = document.querySelector(`.tab-panel[data-tab-id="${tabId}"]`);
    // keep whatever was on screen before switching away from it
    entry.periods[entry.activePeriod] = collectModelFromDOM(panel);
    entry.activePeriod = newPeriod;
    if(!entry.periods[newPeriod]) entry.periods[newPeriod] = JSON.parse(JSON.stringify(SAMPLE_MODEL));
    renderModel(panel, entry.periods[newPeriod]);
    updatePeriodSwitchUI(panel, newPeriod);
    updateSheetTitle(panel, newPeriod);
  }

  function attachPersonPanelHandlers(panel, tabId){
    const fileInput = panel.querySelector('.file-input');
    const statusEl = panel.querySelector('.import-status');

    panel.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', () => switchPeriod(tabId, btn.dataset.period));
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try{
          const data = new Uint8Array(ev.target.result);
          const workbook = XLSX.read(data, { type:'array' });
          const parsed = parseWorkbookAll(workbook);
          if(!parsed.first_half && !parsed.second_half){
            throw new Error('「上期評価シート」「下期評価シート」のいずれのシートも見つかりませんでした');
          }
          const entry = state.models[tabId];
          if(parsed.first_half){
            if(!parsed.first_half.meta.name) parsed.first_half.meta.name = entry.name;
            entry.periods.first_half = parsed.first_half;
          }
          if(parsed.second_half){
            if(!parsed.second_half.meta.name) parsed.second_half.meta.name = entry.name;
            entry.periods.second_half = parsed.second_half;
          }
          // show a period that was actually just updated
          const shownPeriod = parsed[entry.activePeriod] ? entry.activePeriod : (parsed.first_half ? 'first_half' : 'second_half');
          entry.activePeriod = shownPeriod;
          renderModel(panel, entry.periods[shownPeriod]);
          updatePeriodSwitchUI(panel, shownPeriod);
          updateSheetTitle(panel, shownPeriod);

          const parts = [];
          if(parsed.first_half) parts.push('上期');
          if(parsed.second_half) parts.push('下期');
          statusEl.textContent = `「${file.name}」から${parts.join('・')}を読み込みました（保存を押すまでサーバーには反映されません）`;
          statusEl.className = 'import-status ok';
        }catch(err){
          statusEl.textContent = `読み込みに失敗しました：${err.message}`;
          statusEl.className = 'import-status error';
        }
      };
      reader.readAsArrayBuffer(file);
      fileInput.value = '';
    });

    panel.querySelector('.save-btn').addEventListener('click', () => saveTab(tabId));
  }

  function openPersonTab(record, isNew){
    const tabId = record.id;
    if(state.models[tabId]){ setActive(tabId); return; }

    const periods = normalizePeriods(record.data);
    const activePeriod = periods.first_half ? 'first_half' : (periods.second_half ? 'second_half' : 'first_half');
    if(!periods[activePeriod]) periods[activePeriod] = JSON.parse(JSON.stringify(SAMPLE_MODEL));

    state.tabs.push({ id: tabId, name: record.name });
    state.models[tabId] = { periods, activePeriod, recordId: isNew ? null : record.id, name: record.name };

    const panel = document.createElement('div');
    panel.className = 'tab-panel';
    panel.dataset.tabId = tabId;
    panel.innerHTML = personPanelHtml();
    document.getElementById('tab-panels').appendChild(panel);

    renderModel(panel, periods[activePeriod]);
    updatePeriodSwitchUI(panel, activePeriod);
    updateSheetTitle(panel, activePeriod);
    attachPersonPanelHandlers(panel, tabId);

    renderTabBar();
    setActive(tabId);
  }

  async function openPersonTabById(id){
    if(state.models[id]){ setActive(id); return; }
    const { data, error } = await sb.from('eval_sheets').select('*').eq('id', id).single();
    if(error){ alert('読み込みに失敗しました：' + error.message); return; }
    openPersonTab(data, false);
  }

  async function saveTab(tabId){
    const entry = state.models[tabId];
    const panel = document.querySelector(`.tab-panel[data-tab-id="${tabId}"]`);
    const statusEl = panel.querySelector('.import-status');

    // sync whatever's currently on screen back into memory first
    entry.periods[entry.activePeriod] = collectModelFromDOM(panel);
    const name = entry.periods[entry.activePeriod].meta.name.trim();
    if(!name){
      statusEl.textContent = '氏名を入力してから保存してください';
      statusEl.className = 'import-status error';
      return;
    }
    ['first_half', 'second_half'].forEach(p => { if(entry.periods[p]) entry.periods[p].meta.name = name; });

    statusEl.textContent = '保存中...';
    statusEl.className = 'import-status';

    const dataToSave = { first_half: entry.periods.first_half, second_half: entry.periods.second_half };

    try{
      if(entry.recordId){
        const { error } = await sb.from('eval_sheets').update({ name, data: dataToSave }).eq('id', entry.recordId);
        if(error) throw error;
      } else {
        const { data: existing } = await sb.from('eval_sheets').select('id, data').eq('name', name).maybeSingle();
        if(existing){
          const existingPeriods = normalizePeriods(existing.data);
          const merged = {
            first_half: dataToSave.first_half || existingPeriods.first_half,
            second_half: dataToSave.second_half || existingPeriods.second_half
          };
          const { error } = await sb.from('eval_sheets').update({ data: merged }).eq('id', existing.id);
          if(error) throw error;
          entry.recordId = existing.id;
        } else {
          const { data: inserted, error } = await sb.from('eval_sheets').insert({ name, data: dataToSave }).select().single();
          if(error) throw error;
          entry.recordId = inserted.id;
        }
      }
      entry.name = name;
      renderTabBar();
      statusEl.textContent = `保存しました（${new Date().toLocaleTimeString('ja-JP')}）`;
      statusEl.className = 'import-status ok';
      loadSummaryList();
    }catch(err){
      statusEl.textContent = `保存に失敗しました：${err.message}`;
      statusEl.className = 'import-status error';
    }
  }

  /* ---------- summary panel ---------- */
  let summaryPeriod = 'first_half';

  function computeItemScore(it){
    if(!it || it.weight === null || it.weight === undefined) return null;
    if(it.self === null || it.self === undefined) return null;
    const max = it.maxPoint || (it.tiers ? it.tiers.length : 6) || 6;
    return (Number(it.self) / max) * 100 * it.weight / 100;
  }
  function computeContribScore(c){
    if(!c || c.self === null || c.self === undefined) return null;
    return Number(c.self);
  }
  function computeTotalFromModel(model){
    if(!model) return null;
    let total = 0, any = false;
    (model.items || []).forEach(it => {
      const s = computeItemScore(it);
      if(s !== null){ total += s; any = true; }
    });
    const cs = computeContribScore(model.contribution);
    if(cs !== null){ total += cs; any = true; }
    return any ? total : null;
  }
  function fmtScore(v){ return (v === null || v === undefined) ? '—' : v.toFixed(1); }

  async function loadSummaryList(){
    const { data, error } = await sb.from('eval_sheets').select('id,name,data,updated_at').order('name');
    const container = document.getElementById('people-list');
    if(error){
      container.innerHTML = `<p>読み込みに失敗しました：${escapeHtml(error.message)}</p>`;
      return;
    }
    window.__allPeople = data;
    renderPeopleList(data);
  }

  function renderPeopleList(list){
    const container = document.getElementById('people-list');
    if(list.length === 0){
      container.innerHTML = '<p class="footnote">まだ登録されていません。上の「Excelを一括インポート」または「＋新規追加」から登録してください。</p>';
      return;
    }
    const rows = list.map(p => {
      const model = normalizePeriods(p.data)[summaryPeriod];
      const items = (model && model.items) || [];
      const itemCells = Array.from({ length: 5 }, (_, i) => {
        const it = items[i];
        const tier = (it && it.self !== null && it.self !== undefined) ? it.self : null;
        return `<td>${tier === null ? '—' : tier}</td>`;
      }).join('');
      const contribScore = model ? computeContribScore(model.contribution) : null;
      const total = computeTotalFromModel(model);
      const grade = total === null ? '—' : gradeFor(total);
      return `
        <tr class="person-row" data-id="${p.id}">
          <td class="col-name">${escapeHtml(p.name)}</td>
          ${itemCells}
          <td>${fmtScore(contribScore)}</td>
          <td><span class="grade-pill">${grade}</span></td>
          <td class="person-updated">${p.updated_at ? new Date(p.updated_at).toLocaleDateString('ja-JP') : ''}</td>
        </tr>`;
    }).join('');

    container.innerHTML = `
      <table class="summary-table">
        <thead>
          <tr>
            <th class="col-name">氏名</th>
            <th>①</th><th>②</th><th>③</th><th>④</th><th>⑤</th>
            <th>貢献ポイント</th>
            <th>評価ランク</th>
            <th>更新日</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  document.getElementById('summary-period-switch').addEventListener('click', (e) => {
    const btn = e.target.closest('.period-btn');
    if(!btn) return;
    summaryPeriod = btn.dataset.period;
    document.querySelectorAll('#summary-period-switch .period-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderPeopleList(window.__allPeople || []);
  });

  document.getElementById('people-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.person-row');
    if(!btn) return;
    openPersonTabById(btn.dataset.id);
  });

  document.getElementById('search-input').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    const filtered = (window.__allPeople || []).filter(p => p.name.includes(q));
    renderPeopleList(filtered);
  });

  document.getElementById('add-new-btn').addEventListener('click', () => {
    const tempId = 'new-' + Date.now();
    openPersonTab({ id: tempId, name: '新規', data: { first_half: null, second_half: null } }, true);
  });

  /* ---------- bulk import ---------- */
  const bulkFileInput = document.getElementById('bulk-file-input');
  bulkFileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if(files.length === 0) return;
    const results = [];
    for(const file of files){
      try{
        const buf = await file.arrayBuffer();
        const workbook = XLSX.read(new Uint8Array(buf), { type:'array' });
        const periods = parseWorkbookAll(workbook);
        if(!periods.first_half && !periods.second_half){
          throw new Error('「上期評価シート」「下期評価シート」のいずれのシートも見つかりませんでした');
        }
        const detectedName = (periods.first_half && periods.first_half.meta.name) ||
                              (periods.second_half && periods.second_half.meta.name) || '';
        results.push({ fileName: file.name, periods, detectedName });
      }catch(err){
        results.push({ fileName: file.name, periods: null, error: err.message });
      }
    }
    showBulkReview(results);
    bulkFileInput.value = '';
  });

  function showBulkReview(results){
    const box = document.getElementById('bulk-review');
    box.hidden = false;
    box.innerHTML = `
      <table class="review-table">
        <thead><tr><th>ファイル名</th><th>氏名</th><th>取り込みシート</th><th>状態</th></tr></thead>
        <tbody>
          ${results.map((r, i) => `
            <tr data-idx="${i}">
              <td>${escapeHtml(r.fileName)}</td>
              <td>${r.periods ? `<input type="text" class="review-name" value="${escapeHtml(r.detectedName)}" placeholder="氏名を入力">` : '—'}</td>
              <td>${r.periods ? [r.periods.first_half ? '上期' : null, r.periods.second_half ? '下期' : null].filter(Boolean).join('・') : '—'}</td>
              <td>${r.periods ? (r.detectedName ? '検出済み' : '氏名を要入力') : `<span style="color:var(--note)">読み込み失敗：${escapeHtml(r.error)}</span>`}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="toolbar" style="margin-top:10px;">
        <button class="btn-file" id="bulk-confirm-btn" type="button">登録する</button>
        <button class="btn-reset" id="bulk-cancel-btn" type="button">キャンセル</button>
      </div>`;

    document.getElementById('bulk-cancel-btn').addEventListener('click', () => {
      box.hidden = true;
      box.innerHTML = '';
    });

    document.getElementById('bulk-confirm-btn').addEventListener('click', async () => {
      const confirmBtn = document.getElementById('bulk-confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.textContent = '登録中...';
      const rows = box.querySelectorAll('tbody tr');
      let okCount = 0, skipCount = 0;
      for(const row of rows){
        const idx = Number(row.dataset.idx);
        const item = results[idx];
        if(!item.periods){ skipCount++; continue; }
        const nameInput = row.querySelector('.review-name');
        const name = nameInput.value.trim();
        if(!name){ skipCount++; continue; }
        if(item.periods.first_half) item.periods.first_half.meta.name = name;
        if(item.periods.second_half) item.periods.second_half.meta.name = name;
        try{
          const { data: existing } = await sb.from('eval_sheets').select('id, data').eq('name', name).maybeSingle();
          if(existing){
            const existingPeriods = normalizePeriods(existing.data);
            const merged = {
              first_half: item.periods.first_half || existingPeriods.first_half,
              second_half: item.periods.second_half || existingPeriods.second_half
            };
            await sb.from('eval_sheets').update({ data: merged }).eq('id', existing.id);
          } else {
            await sb.from('eval_sheets').insert({ name, data: item.periods });
          }
          okCount++;
        }catch(err){
          skipCount++;
        }
      }
      box.hidden = true;
      box.innerHTML = '';
      document.getElementById('summary-status').textContent =
        `${okCount}件登録・更新しました${skipCount ? `（${skipCount}件はスキップされました）` : ''}`;
      loadSummaryList();
    });
  }

  /* ---------- boot ---------- */
  window.__initSheetApp = async function(){
    await loadSummaryList();
  };
})();
</script>
<script>
  (async () => {
    const result = await requireAuth('app');
    if(!result) return;
    document.getElementById('user-email').textContent = result.user.email;
    if(result.profile.is_admin) document.getElementById('admin-link').hidden = false;
    document.getElementById('loading').hidden = true;
    document.getElementById('app-shell').hidden = false;
    await window.__initSheetApp();
  })();
  document.getElementById('logout-btn').addEventListener('click', signOut);
</script>
</body>
</html>
