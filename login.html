<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン - 評価シート</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-shell">
    <form class="auth-card" id="login-form">
      <span class="eyebrow">評価シート</span>
      <h1>ログイン</h1>
      <div id="msg-area"></div>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="primary" id="submit-btn">ログイン</button>
      <a class="link" href="signup.html">アカウントをお持ちでない方はこちら</a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    (async () => {
      const user = await getSessionUser();
      if(user) location.href = 'index.html';
    })();

    const form = document.getElementById('login-form');
    const msgArea = document.getElementById('msg-area');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgArea.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'ログイン中...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error){
        msgArea.innerHTML = `<div class="msg error">ログインに失敗しました：${error.message}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = 'ログイン';
        return;
      }
      location.href = 'index.html';
    });
  </script>
</body>
</html>
